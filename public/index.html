<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zdjęcia z wydarzeń wojskowych</title>
  <meta name="description" content="Zdjęcia z wydarzeń wojskowych, ułożone według wydarzeń.">
  <meta name="theme-color" content="#1c4630">
  <link rel="icon" href="/assets/emblem.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip mono" href="#feed">Przejdź do zdjęć</a>

  <header class="masthead" id="top">
    <div class="wrap">
      <div class="topline mono">
        <a class="brand" href="/"><img src="/assets/emblem.svg" alt="" width="32" height="32">Wydarzenia wojskowe</a>
        <a class="link" href="/admin.html">Panel</a>
      </div>
      <h1 class="display">Zdjęcia z wydarzeń<span>wojskowych</span></h1>
    </div>
  </header>

  <nav id="index" class="wrap index hidden" aria-labelledby="index-title">
    <div class="index-head">
      <h2 id="index-title" class="display">Spis wydarzeń</h2>
      <span class="mono" id="index-count"></span>
    </div>
    <ol id="index-list"></ol>
  </nav>

  <main id="feed" class="wrap feed" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="display">Zdjęcia z wydarzeń<br>wojskowych</p>
      <div class="footer-bar mono">
        <span>&copy; <span id="year"></span></span>
        <a href="#top">Do góry &uarr;</a>
      </div>
    </div>
  </footer>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-labelledby="v-title" aria-hidden="true">
    <div class="viewer-top">
      <h2 id="v-title"></h2>
      <span id="v-count" class="viewer-count mono"></span>
      <button class="v-btn v-close" id="v-close" type="button" aria-label="Zamknij podgląd">&times;</button>
    </div>
    <div class="viewer-stage" id="v-stage">
      <img id="v-img" alt="">
      <button class="v-btn v-prev" id="v-prev" type="button" aria-label="Poprzednie zdjęcie">&larr;</button>
      <button class="v-btn v-next" id="v-next" type="button" aria-label="Następne zdjęcie">&rarr;</button>
    </div>
    <div class="viewer-cap">
      <span id="v-nr" class="nr mono"></span>
      <span id="v-sub"></span>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script src="/assets/gallery.js"></script>
</body>
</html>
